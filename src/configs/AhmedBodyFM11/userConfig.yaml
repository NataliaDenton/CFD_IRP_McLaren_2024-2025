###########################################
#     Parallel computing settings         #
###########################################
cores: 16               # number of CPU cores to use for parallel execution


###########################################
#            Case settings                #
###########################################
filePath:
  caseDir: "../src/Openfoam/AhmedBodyFC"    # directory where the OpenFOAM case resides
  logDir: "log"                            # base directory for all log files
  logMesh: "log/blockMesh.log"             # log for background mesh generation
  logSnappy: "log/snappyHexMesh.log"       # log for snappyHexMesh execution
  logPotential: "log/potentialFoam.log"    # log for potentialFoam preprocessing
  logSolver: "log/simpleFoam.log"          # log for the steady-state solver (simpleFoam)


###########################################
#          Geometry Settings              #
###########################################
  geometries:                             # list of STL geometry parts to import
    body:                                 # short key to reference the vehicle body
      file: "constant/triSurface/Geometry/01_body.stl"
    sideMirrors:
      file: "constant/triSurface/Geometry/02_side-mirrors.stl"
    underbody:
      file: "constant/triSurface/Geometry/08_underbody-flat.stl"
    wheelsFront:
      file: "constant/triSurface/Geometry/17_wheels-front.stl"
    wheelsRear:
      file: "constant/triSurface/Geometry/18_wheels-rear.stl"
    rearEnd:
      file: "constant/triSurface/Geometry/03_rear-end_estate.stl"
    coolingBlocker:
      file: "constant/triSurface/Geometry/20_cooling-air-closing.stl"


###########################################
#                Meshing                  #
###########################################
mesh:
  useSnappy: true      # enable snappyHexMesh workflow
  useCfMesh: false     # disable cfMesh alternative path

snappyHexMeshDict:    # high‑level toggles; detailed configuration resides in advancedConfig
  castellatedMesh: true    # perform castellated‑mesh (cut background cells)
  snap: true               # snap cell faces onto the STL geometry
  addLayers: true          # add prism layers near walls for y⁺ control
  refinementRegions: true  # activate region‑based and box‑based refinements


###########################################
#            Fluid Properties             #
###########################################
fluid:                    # physical properties of the working fluid
  name: air
  rho: 1.184              # fluid density [kg/m³] at 15 °C, sea‑level
  nu: 1.56e-5             # kinematic viscosity [m²/s]


###########################################
#            Turbulence Model             #
###########################################
turbulence:
  simulationType: RAS     # Reynolds‑Averaged Simulation framework
  model: kEpsilon         # choose k‑ε model for turbulence closure


###########################################
#           Initial conditions            #
###########################################
fields:                  # list of primary fields to initialize
  - U
  - p
  - k
  - epsilon
  - nut

U:
  internalField: [60, 0, 0]  # uniform freestream velocity [m/s]
  boundaries:
    inlet:
      type: fixedValue
      value: [60, 0, 0]
    outlet:
      type: zeroGradient
    moving_wall:
      type: movingWallVelocity
      value: [60, 0, 0]
    top_wall:
      type: symmetry       # since it's a wall, symmetryPlane not allowed
    lh_wall:
      type: symmetry
    rh_wall:
      type: symmetry
    no_slip_wall:
      type: fixedValue
      value: [0, 0, 0]

p:
  internalField: 101325
  boundaries:
    inlet:
      type: zeroGradient
    outlet:
      type: fixedValue
      value: 101325
    moving_wall:
      type: zeroGradient
    top_wall:
      type: symmetry
    lh_wall:
      type: symmetry
    rh_wall:
      type: symmetry
    no_slip_wall:
      type: zeroGradient

k:
  internalField: 1.62
  boundaries:
    inlet:
      type: fixedValue
      value: 1.62
    outlet:
      type: zeroGradient
    moving_wall:
      type: kqRWallFunction
      value: uniform 1.62
    top_wall:
      type: symmetry
    lh_wall:
      type: symmetry
    rh_wall:
      type: symmetry
    no_slip_wall:
      type: kqRWallFunction
      value: uniform 1.62

epsilon:
  internalField: 4.2
  boundaries:
    inlet:
      type: fixedValue
      value: 4.2
    outlet:
      type: zeroGradient
    moving_wall:
      type: epsilonWallFunction
      value: uniform 4.2
    top_wall:
      type: symmetry
    lh_wall:
      type: symmetry
    rh_wall:
      type: symmetry
    no_slip_wall:
      type: epsilonWallFunction
      value: uniform 4.2

nut:
  internalField: 0.0908
  boundaries:
    inlet:
      type: calculated
      value: 0.0908
    outlet:
      type: calculated
      value: 0.0908
    moving_wall:
      type: nutkWallFunction
      value: uniform 0
    top_wall:
      type: symmetry
    lh_wall:
      type: symmetry
    rh_wall:
      type: symmetry
    no_slip_wall:
      type: nutkWallFunction
      value: uniform 0



###########################################
#               Control                   #
###########################################
###########################################
#               Control                   #
###########################################

control:
  snappy:
    application: snappyHexMesh
    startTime: 0
    endTime: 10
    deltaT: 1e-2
    writeControl: timeStep
    writeInterval: 50
    purgeWrite: 100

  pimpleInit:                     # ← transient initialisation block
    application: pimpleFoam
    startTime: 0
    endTime: 0.01
    deltaT: 0.001
    writeControl: timeStep
    writeInterval: 10
    purgeWrite: 0
    writeFormat: ascii
    writePrecision: 6

  solver:                         # ← steady-state solver block
    application: simpleFoam
    adjustTimeStep: true
    maxCo: 0.4    
    startFrom: latestTime 
    startTime: 0
    stopAt: endTime
    endTime: 6
    deltaT: 0.01
    writeControl: timeStep
    writeInterval: 100
    purgeWrite: 0
    averageTimeStart: 1

#####################################################

  # ---------- numerical defaults ----------
fvSchemes:
  default: steadyState    # use 'steadyState' scheme for time derivative (simpleFoam style)

