
###########################################
#           decomposeParDict              #
###########################################
decomposeParDict:
  method: scotch 

  simpleCoeffs:
    n: (2 3 1)
    delta: 0.001

  hierarchicalCoeffs:
    n: (1 3 2)
    delta: 0.001
    order: xyz
  distributed: no
  roots: ()


###########################################
#     Advanced Geometry Settings          #
###########################################
advancedGeometrySettings:

  filePath:                           # ← container for geometry-related files
    mergedGeometry:                   #   single STL after you stitch everything
      file: "constant/triSurface/Geometry/mergedGeometry/mergedGeometry.stl"  # path on disk
      name: Geometry                  #   patch name used by snappyHexMesh

    refinementLevel: [3, 4]           # [minLevel, maxLevel] for surface refinement
                                       #   ↑ raise to capture finer detail (cost ↑)

    boundingBoxGeneration_res: "constant/polyMesh/boundingBoxVertices.json" # helper JSON that stores auto-box verts
    blockMesh: "system/blockMeshDict"  # template blockMesh file to build background mesh
    surfaceFeatureExtractDict: "system/surfaceFeatureExtractDict"           # edge-extraction settings file

  # ----- automatic fluid Region size --------------------------------
  scaling:                            # multipliers applied to geom bbox
    front: 5.0      # multiply bbox length in negative-x  direction
    back: 10.0      # multiply bbox length in positive-x  direction
    side: 5.0       # multiply half-width in ±y directions
    top: 5.0        # multiply height in +z direction (z- < ground handled elsewhere)

  # ----- feature edge detection -------------------------------------
  surfaceFeatureExtractDict:
    extractAngle: 150  # degrees; edges sharper than this are kept
    includedAngle: 30  # fallback angle used by snappy if separate dict missing
                                       # (smaller → more edges, smoother mesh)

###########################################
#          snappyHexMeshDict              #
###########################################
snappyHexMeshDict:
  debug:          0      # 0-5 ; higher = more console spam
  mergeTolerance: 1e-6   # points closer than this (fraction of local cell) are merged

  # -- geometry table (snappy consumes this) -------------------------
  geometry:
    Geometry:
      type: triSurfaceMesh          # built-in reader for STL/OBJ
      file: "Geometry/mergedGeometry/mergedGeometry.stl"
      name: Geometry
    refinementBox:                  # extra Cartesian box for local refinement
      type: searchableBox
    refinementBox2:
      type: searchableBox           # second local refinment box for full car


  # -- castellatedMesh stage (cut cells) -----------------------------
  castellatedMeshControls:
    maxLocalCells:      10000000    # per-CPU hard-stop
    maxGlobalCells:     15000000    # total mesh cell cap
    minRefinementCells: 10          # minimum cells inside a refined feature
    nCellsBetweenLevels: 5          # transition thickness between Lv-3 → Lv-4
    mergeTolerance:     1e-6        # duplicate-point merge tol (same as root)
    baseCellSize: 0.2
    features: ()                    # will be filled by surfaceFeatureExtract
    resolveFeatureAngle: 30         # edges sharper than 30° refined one extra level

    refinementSurfaces:             # surface-specific levels
      Geometry:
        level: [2, 4]

    refinementRegions:
      refinementBox:
        name: refinementBox         # link to searchableBox above
        type: searchableBox
        scaling:                    # refine even smaller sub-box inside sim domain
          front: 1.0
          back:  2.0
          side:  0.5
          top:   0.5
        mode: inside                # only refine cells *inside* the box
        levels: [3, 4]
      refinementBox2:
        name: refinementBox2         # link to searchableBox above
        type: searchableBox
        scaling:                    # refine even smaller sub-box inside sim domain
          front: 0.2
          back:  0.75
          side:  0.2
          top:   0.2
        mode: inside                # only refine cells *inside* the box
        levels: [5, 6]

    locationInMesh: (0 0 0)         # seed point that is **inside** the fluid
    allowFreeStandingZoneFaces: false # rare exotic option → usually keep false

  # -- snap stage (project faces onto STL) ---------------------------
  snapControls:
    nSmoothPatch:       3    # surface smoothing sweeps
    tolerance:          2.0  # larger → more aggressive projection
    nSolveIter:         30   # iterations solving Laplace eqn for snapping
    nRelaxIter:         5    # geometric relaxation sweeps between solves
    explicitFeatureSnap: true  # two-phase explicit edge snapping
    multiRegionSnap:     false # only set true for conjugate-heat or multi-fluid

# -- addLayers stage (prism boundary layers) ----------------------
  addLayersControls:
    relativeSizes: true          # express thicknesses as % of cell size
    layers:                      # number of layers per patch
      Geometry: {nSurfaceLayers: 25}
      bottom:   {nSurfaceLayers: 25}
    expansionRatio:        1.1   # growth per layer (1 = uniform)
    finalLayerThickness:   0.3   # 30 % of local cell height
    minThickness:          0.05   # discard if <5 % of local cell
    nGrow:                 1     # 0 → don’t grow layers onto neighbours
    featureAngle:          270    # stop layer if surface bends >60°
    nRelaxIter:            3     # smoothing sweeps of layer mesh
    nSmoothSurfaceNormals: 1
    nSmoothNormals:        3
    nSmoothThickness:      10
    maxFaceThicknessRatio: 0.5
    maxThicknessToMedialRatio: 0.3
    minMedialAxisAngle:    60
    nBufferCellsNoExtrude: 0
    nLayerIter:            50    # global extrusion iterations
    nRelaxedIter:          20    # extra smoothing after extrusion




  # -- quality gatekeeping (mesh must satisfy all) ------------------
  meshQualityControls:
    maxNonOrtho:          65     # °; > 70 often destabilises SIMPLE
    maxBoundarySkewness:  10
    maxInternalSkewness:  4
    maxConcave:           70
    minVol:               1e-9  # m³; prevent tiny slivers
    minTetQuality:        1e-5
    minArea:              -1     # disable if negative
    minTwist:             0.02
    minDeterminant:       0.001
    minFaceWeight:        0.02
    minVolRatio:          0.01
    minTriangleTwist:     -1
    nSmoothScale:         4
    errorReduction:       0.75   # how hard to try auto-fixing bad cells

###########################################
#        Advanced Fluid Properties        #
###########################################
turbulence:
  RAS:
    turbulence: on        # must be ‘on’ for RANS; ‘off’ = laminar
    printCoeffs: on       # dump model constants each step (useful for debug)

###########################################
#      Advanced initial conditions        #
###########################################

fields:
  - U
  - p
  - k
  - epsilon
  - nut

U:
  dimensions: [0, 1, -1, 0, 0, 0, 0]
p:
  dimensions: [0, 2, -2, 0, 0, 0, 0]


k:
  dimensions: [0, 2, -2, 0, 0, 0, 0]

epsilon:
  dimensions: [0, 2, -3, 0, 0, 0, 0]

nut:
  dimensions: [0, 2, -1, 0, 0, 0, 0]









###########################################
#           Advanced Control              #
###########################################
control:
  application: snappyHexMesh  # overrides when this file drives meshing stage
  startFrom: startTime        # read latestTime | startTime | firstTime
  stopAt:   endTime           # run until endTime
  writeFormat: ascii          # ascii = big files, human-readable
  writePrecision: 6           # decimals in output
  writeCompression: uncompressed
  timeFormat: general
  timePrecision: 6
  runTimeModifiable: true     # allow dict tweaks mid-run (meshStep only once)

###########################################
#              fvSchemes                  #
###########################################
fvSchemes:                   # chooses discretisation (higher-order vs robust)
  gradSchemes:
    default: Gauss linear
    grad(p): Gauss linear     # explicit override = same as default for clarity
    grad(U): Gauss linear
  divSchemes:
    div(phi,U):           Gauss linearUpwind grad(U)  # upwind for convection
    div(phi,k):           Gauss upwind
    div(phi,epsilon):     Gauss upwind
    div((nuEff*dev2(T(grad(U))))): Gauss linear       # diffusion term
  laplacianSchemes:
    default: Gauss linear corrected
  interpolationSchemes:
    default: linear
  snGradSchemes:
    default: corrected
  fluxRequired:
    default: no
    p: null                  # pressure flux not stored

###########################################
#              fvSolution                 #
###########################################
fvSolution:
  solvers:
    p:                        # pressure linear solver
      solver: GAMG           # Geo-Agglomerated multigrid
      tolerance: 1e-10       # absolute residual stop
      relTol:   1e-20        # relative residual stop (tiny → full solve each iter)
      smoother: GaussSeidel
      nPreSweeps: 0
      nPostSweeps: 2
      cacheAgglomeration: true
      nCellsInCoarsestLevel: 10
      aggressiveCoeffs: 1
      agglomerator: faceAreaPair
      mergeLevels: 1
    U:                         # velocity linear solver
      solver: smoothSolver
      smoother: symGaussSeidel
      tolerance: 1e-10
      relTol: 1e-20
    k:
      solver: smoothSolver
      smoother: symGaussSeidel
      tolerance: 1e-10
      relTol: 1e-20
    epsilon:
      solver: smoothSolver
      smoother: symGaussSeidel
      tolerance: 1e-10
      relTol: 1e-20

  SIMPLE:                       # steady-state pressure–velocity loop
    nNonOrthogonalCorrectors: 3 # extra p-equations for non-orth cell fix
    pRefPoint: (0 0 0)          # reference cell for absolute pressure
    pRefValue: 0
    residualControl:            # solver stops when ALL < target
      p:       1e-9
      U:       1e-9
      k:       1e-9
      epsilon: 1e-9

  relaxationFactors:            # under-relaxation to damp oscillations
    fields:
      p: 0.3
    equations:
      U:       0.5
      k:       0.5
      epsilon: 0.5

