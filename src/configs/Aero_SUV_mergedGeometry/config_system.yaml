filePath:
  controlDict: "system/controlDict"
  fvSchemes: "system/fvSchemes"
  fvSolution: "system/fvSolution"
  snappyHexMeshDict: "system/snappyHexMeshDict"

control:
  application: "snappyHexMesh"
  startTime: 0
  endTime: 1000
  deltaT: 100
  writeInterval: 1
  purgeWrite: 11

snappyHexMeshDict:
  castellatedMesh: true
  snap: true
  addLayers: false
  geometry:
    file: "Geometry/mergedGeometry/mergedGeometry.stl"
    refinementLevel: [1, 3]
    name: Geometry

fvSchemes:
  ddtSchemes:
    default: steadyState

  gradSchemes:
    default: Gauss linear
    grad(p): Gauss linear
    grad(U): Gauss linear

  divSchemes:
    div(phi,U): Gauss linearUpwind grad(U)
    div(phi,k): Gauss upwind
    div(phi,epsilon): Gauss upwind
    div((nuEff*dev2(T(grad(U))))): Gauss linear

  laplacianSchemes:
    default: Gauss linear corrected

  interpolationSchemes:
    default: linear

  snGradSchemes:
    default: corrected

  fluxRequired:
    default: no
    p: null

fvSolution:
  solvers:
    p:
      solver: GAMG
      tolerance: 1e-8
      relTol: 1e-10
      smoother: GaussSeidel
      nPreSweeps: 0
      nPostSweeps: 2
      cacheAgglomeration: true
      nCellsInCoarsestLevel: 10
      aggressiveCoeffs: 1
      agglomerator: faceAreaPair
      mergeLevels: 1

    U:
      solver: smoothSolver
      smoother: symGaussSeidel
      tolerance: 1e-8
      relTol: 1e-10

    k:
      solver: smoothSolver
      smoother: symGaussSeidel
      tolerance: 1e-8
      relTol: 1e-10

    epsilon:
      solver: smoothSolver
      smoother: symGaussSeidel
      tolerance: 1e-8
      relTol: 1e-10

  SIMPLE:
    nNonOrthogonalCorrectors: 0
    pRefPoint: (0 0 0)
    pRefValue: 0
    residualControl:
      p: 1e-7
      U: 1e-7
      k: 1e-8
      epsilon: 1e-8

  relaxationFactors:
    fields:
      p: 0.3
    equations:
      U: 0.7
      k: 0.7
      epsilon: 0.7



