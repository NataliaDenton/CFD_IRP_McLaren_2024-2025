###########################################
#               control                   #
###########################################
control:
  application: snappyHexMesh
  startFrom: startTime
  startTime: 0
  stopAt: endTime
  endTime: 1000
  deltaT: 100
  writeControl: timeStep
  writeInterval: 1
  purgeWrite: 11
  writeFormat: ascii
  writePrecision: 6
  writeCompression: uncompressed
  timeFormat: general
  timePrecision: 6
  runTimeModifiable: true




###########################################
#          snappyHexMeshDict              #
###########################################
snappyHexMeshDict:
  debug: 0
  mergeTolerance: 1E-6
  castellatedMesh: true
  castellatedMeshControls:
    maxLocalCells: 1000000
    maxGlobalCells: 2000000
    minRefinementCells: 10
    nCellsBetweenLevels: 3
    mergeTolerance:     1e-6    
    features: ()
    resolveFeatureAngle: 30
    refinementRegions: {}
    locationInMesh: (0 0 0)
    allowFreeStandingZoneFaces: false

  snap: true
  snapControls:
    nSmoothPatch: 3
    tolerance: 2.0
    nSolveIter: 30
    nRelaxIter: 5


  addLayers: false
  addLayersControls:
    relativeSizes: true
    layers:
      region: 
        name:  Geometry
        filePath: "Geometry/mergedGeometry/mergedGeometry.stl"
        nSurfaceLayers: 3
        refinementLevel: [1, 3]
    expansionRatio: 1.0
    finalLayerThickness: 0.3
    minThickness: 0.1
    nGrow: 0
    featureAngle: 60
    nRelaxIter: 3
    nSmoothSurfaceNormals: 1
    nSmoothNormals: 3
    nSmoothThickness: 10
    maxFaceThicknessRatio: 0.5
    maxThicknessToMedialRatio: 0.3
    minMedialAxisAngle: 60
    nBufferCellsNoExtrude: 0
    nLayerIter: 50
    nRelaxedIter: 20

  meshQualityControls:
    maxNonOrtho: 65
    maxBoundarySkewness: 20
    maxInternalSkewness: 4
    maxConcave: 80
    minVol: 1e-13
    minTetQuality: 1e-9
    minArea: -1
    minTwist: 0.02
    minDeterminant: 0.001
    minFaceWeight: 0.02
    minVolRatio: 0.01
    minTriangleTwist: -1
    nSmoothScale: 4
    errorReduction: 0.75



###########################################
#              fvSchemes                  #
###########################################
fvSchemes:
  ddtSchemes:
    default: steadyState

  gradSchemes:
    default: Gauss linear
    grad(p): Gauss linear
    grad(U): Gauss linear

  divSchemes:
    div(phi,U): Gauss linearUpwind grad(U)
    div(phi,k): Gauss upwind
    div(phi,epsilon): Gauss upwind
    div((nuEff*dev2(T(grad(U))))): Gauss linear

  laplacianSchemes:
    default: Gauss linear corrected

  interpolationSchemes:
    default: linear

  snGradSchemes:
    default: corrected

  fluxRequired:
    default: no
    p: null

###########################################
#              fvSolution                 #
###########################################

fvSolution:
  solvers:
    p:
      solver: GAMG
      tolerance: 1e-8
      relTol: 1e-10
      smoother: GaussSeidel
      nPreSweeps: 0
      nPostSweeps: 2
      cacheAgglomeration: true
      nCellsInCoarsestLevel: 10
      aggressiveCoeffs: 1
      agglomerator: faceAreaPair
      mergeLevels: 1

    U:
      solver: smoothSolver
      smoother: symGaussSeidel
      tolerance: 1e-8
      relTol: 1e-10

    k:
      solver: smoothSolver
      smoother: symGaussSeidel
      tolerance: 1e-8
      relTol: 1e-10

    epsilon:
      solver: smoothSolver
      smoother: symGaussSeidel
      tolerance: 1e-8
      relTol: 1e-10

  SIMPLE:
    nNonOrthogonalCorrectors: 0
    pRefPoint: (0 0 0)
    pRefValue: 0
    residualControl:
      p: 1e-7
      U: 1e-7
      k: 1e-8
      epsilon: 1e-8

  relaxationFactors:
    fields:
      p: 0.3
    equations:
      U: 0.7
      k: 0.7
      epsilon: 0.7



