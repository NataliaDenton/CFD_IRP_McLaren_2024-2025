###########################################
#               Control                   #
###########################################

control:
  snappy:
    application: snappyHexMesh
    startTime: 0
    endTime: 10
    deltaT: 1e-2
    writeControl: timeStep
    writeInterval: 50
    purgeWrite: 100

  pimpleInit:                     # ← transient initialisation block
    application: pimpleFoam
    startTime: 0
    endTime: 0.01
    deltaT: 0.001
    writeControl: timeStep
    writeInterval: 10
    purgeWrite: 0
    writeFormat: ascii
    writePrecision: 6

  solver:                         # ← steady-state solver block
    application: simpleFoam
    adjustTimeStep: true
    maxCo: 0.4    
    startFrom: latestTime 
    startTime: 0
    stopAt: endTime
    endTime: 6
    deltaT: 0.01
    writeControl: timeStep
    writeInterval: 50
    purgeWrite: 0
    averageTimeStart: 1

#####################################################
# ---------- numerical defaults ----------
fvSchemes:
  default: steadyState    # use 'steadyState' scheme for time derivative (simpleFoam style)

