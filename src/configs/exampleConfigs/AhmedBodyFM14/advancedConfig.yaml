###########################################
#           decomposeParDict              #
###########################################
decomposeParDict:
  method: simple                # use Scotch library for automatic load-balanced decomposition

  simpleCoeffs:                 # parameters if using the “simple” decomposition method
    n: (4 2 2)                  # processor decomposition; 2 in x, 3 in y, 1 in z
    delta: 0.001                # maximum allowed load imbalance

  hierarchicalCoeffs:           # parameters if using hierarchical decomposition
    n: (1 3 2)                  # hierarchical split; 1 in x, 3 in y, 2 in z
    delta: 0.001                # load imbalance tolerance
    order: xyz                  # split in x first, then y, then z

  distributed: no               # “yes” spreads case files across processors; “no” keeps single copy
  roots: ()                     # optional root directories for multi-region cases


###########################################
#     Advanced Geometry Settings          #
###########################################
format: ascii                   # store all geometry data in human-readable ASCII format

advancedGeometrySettings:

  filePath:                     # paths to key geometry files
    mergedGeometry:             # combined surface geometry STL
      file: "constant/triSurface/Geometry/mergedGeometry/mergedGeometry.stl"
                                  # path to stitched STL file
      name: Geometry            # patch name referenced by snappyHexMesh

    refinementLevel: [2, 3]     # [minLevel, maxLevel] for surface refinement
                                  # higher levels capture finer detail (computational cost ↑)

    boundingBoxGeneration_res: "constant/polyMesh/boundingBoxVertices.json"
                                  # JSON file storing automatically generated bounding box vertices
    blockMesh: "system/blockMeshDict"
                                  # base blockMeshDict for generating the initial hexahedral mesh
    surfaceFeatureExtractDict: "system/surfaceFeatureExtractDict"
                                  # dictionary for feature edge extraction settings

  scaling:                      # multipliers applied to the geometry bounding box
    front: 5.0                  # extend domain 5× in negative‑x direction
    back: 10.0                  # extend domain 10× in positive‑x direction
    side: 2.5                   # extend domain ±2.5× in y directions
    top: 2.5                    # extend domain 2.5× in positive‑z (ground treated separately)

  surfaceFeatureExtractDict:    # options for detecting sharp edges on STL
    extractAngle: 150           # keep edges sharper than 150°
    includedAngle: 30           # fallback angle if separate feature dict not found
                                  # smaller → more edges detected, smoother mesh transitions


###########################################
#          snappyHexMeshDict              #
###########################################
baseCellSize: 0.25             # target background mesh cell size (m)

snappyHexMeshDict:
  debug: 0                      # verbosity level (0 = minimal, up to 5 = maximum)
  mergeTolerance: 1e-6          # merge vertices closer than this fraction of local cell size

  geometry:                     # list of geometry objects for snappy to consume
    Geometry:
      type: triSurfaceMesh      # reader type for STL/OBJ files
      file: "Geometry/mergedGeometry/mergedGeometry.stl"
      name: Geometry
    refinementBox:
      type: searchableBox       # box region for localized mesh refinement
    refinementBox2:
      type: searchableBox       # second refinement box for additional regions


  castellatedMeshControls:      # stage 1: cutting background mesh and refining
    maxLocalCells: 25000000     # maximum cells per processor before abort
    maxGlobalCells: 50000000    # maximum total cells for the mesh
    minRefinementCells: 10      # minimum cells to trigger refinement
    nCellsBetweenLevels: 3      # cell layers between successive refinement levels
    mergeTolerance: 1e-6        # point‐merging tolerance (same as root mergeTolerance)
    features: ()                # auto-filled by surfaceFeatureExtract stage
    resolveFeatureAngle: 30     # refine edges sharper than 30° by an extra level

    refinementSurfaces:         # per-surface refinement levels
      Geometry:
        level: [2, 3]           # refine this surface between levels 2 and 3

    refinementRegions:          # box and region‐based refinements
      refinementBox:
        name: refinementBox     # references the “refinementBox” geometry above
        type: searchableBox
        scaling:
          front: 1.0
          back: 5.0
          side: 0.5
          top: 0.5
        mode: inside            # refine only inside this box
        levels: [1, 2]
      refinementBox2:
        name: refinementBox2
        type: searchableBox
        scaling:
          front: 0.2
          back: 0.75
          side: 0.2
          top: 0.2
        mode: inside
        levels: [2, 3]
      refinementBoxwheelsFront:
        name: refinmentBoxWheelsFront
        geometry: wheelsFront
        type: searchableBox
        scaling:
          front: 0.01
          back: 0.01
          side: 0.01
          top: 0.01
        mode: inside
        levels: [3, 4]
      refinementBoxWheelsRear:
        name: refinmentBoxWheelsRear
        geometry: wheelsRear
        type: searchableBox
        scaling:
          front: 0.01
          back: 0.01
          side: 0.01
          top: 0.01
        mode: inside
        levels: [3, 4]

    locationInMesh: (0 0 0)      # a point guaranteed inside the fluid region
    allowFreeStandingZoneFaces: false
                                  # keep false to avoid isolated faces in the mesh

  snapControls:                 # stage 2: project mesh faces onto surface geometry
    nSmoothPatch: 3             # smoothing passes on the surface patches
    tolerance: 2.0              # snapping aggressiveness (higher = more projection)
    nSolveIter: 30              # iterations solving Laplace equation for snapping
    nRelaxIter: 5               # relaxation sweeps between solve iterations
    explicitFeatureSnap: true   # first snap explicitly to edges before surfaces
    multiRegionSnap: false      # only true for multi-region or conjugate-heat cases

  addLayersControls:            # stage 3: add prism layers near walls
    relativeSizes: true         # specify layer thickness as % of local cell size
    layers:
      Geometry: {nSurfaceLayers: 15}   # number of layers on main geometry
      bottom:   {nSurfaceLayers: 0}    # no layers on ground patch
    expansionRatio: 1.2         # layer growth rate (1.0 = uniform thickness)
    finalLayerThickness: 0.3    # last layer thickness = 30% of cell height
    minThickness: 1e-6          # discards layers thinner than this (m)
    nGrow: 0                    # do not grow layers onto adjacent patches
    featureAngle: 180           # stop extrusion where surface bends > 180°
    nRelaxIter: 3               # smoothing passes after layer extrusion
    nSmoothSurfaceNormals: 1
    nSmoothNormals: 3
    nSmoothThickness: 10
    maxFaceThicknessRatio: 0.5
    maxThicknessToMedialRatio: 0.3
    minMedialAxisAngle: 60
    nBufferCellsNoExtrude: 0
    nLayerIter: 50              # max global layer extrusion iterations
    nRelaxedIter: 20            # extra smoothing after all layers added

  meshQualityControls:          # enforce mesh quality metrics before accepting
    maxNonOrtho: 65             # non-orthogonality angle limit (°)
    maxBoundarySkewness: 20     # skewness of boundary faces
    maxInternalSkewness: 4      # skewness of interior cells
    maxConcave: 80              # maximum allowed concavity (°)
    minVol: 1e-13               # minimum cell volume (m³)
    minTetQuality: 1e-9         # tetrahedron quality metric
    minArea: -1                 # disable minimum face area check if negative
    minTwist: 0.02              # minimum allowable twist
    minDeterminant: 0.001       # minimum Jacobian determinant
    minFaceWeight: 0.02
    minVolRatio: 0.01
    minTriangleTwist: -1
    nSmoothScale: 4             # factor for smoothing quality metrics
    errorReduction: 0.75        # effort to automatically fix poor-quality cells

###########################################
#        Advanced Fluid Properties        #
###########################################
turbulence:
  RAS:
    turbulence: on             # enable RANS turbulence model
    printCoeffs: on            # output turbulence model constants each iteration

###########################################
#      Advanced initial conditions        #
###########################################
fields:                        # list of fields to define units only
  - U
  - p
  - k
  - epsilon
  - nut

U:                             # velocity units
  dimensions: [0, 1, -1, 0, 0, 0, 0]

p:                             # pressure units
  dimensions: [0, 2, -2, 0, 0, 0, 0]

k:                             # turbulence kinetic energy units
  dimensions: [0, 2, -2, 0, 0, 0, 0]

epsilon:                       # dissipation rate units
  dimensions: [0, 2, -3, 0, 0, 0, 0]

nut:                           # kinematic viscosity units
  dimensions: [0, 2, -1, 0, 0, 0, 0]


###########################################
#           Advanced Control              #
###########################################
control:
  application: simpleFoam # command that this dict drives
  startFrom: startTime         # start from the case’s startTime
  stopAt: endTime              # stop at the case’s endTime
  writeFormat: ascii           # output file format
  writePrecision: 6            # decimal precision in written data
  writeCompression: uncompressed
  timeFormat: general          # time directory naming format
  timePrecision: 6             # decimal digits in time directories
  runTimeModifiable: true      # allow inline dict edits during run
  adjustTimeStep: true         # adapt meshStep based on maxCo
  maxCo: 0.4                   # maximum Courant number for meshStep


###########################################
#          Unsteady I/O Control           #
###########################################
unsteadyIO:
  startTime: 0
  endTime: 100
  deltaT: 0.001
  writeControl: timeStep        # write every N time steps
  writeInterval: 100            # N = 100
  purgeWrite: 0                 # do not delete old time directories


###########################################
#       forceCoeffs Configuration         #
###########################################
forceCoeffs:
  enabled: true
  patches: "no_slip_wall"            # compute forces on this patch
  magUInf: 60.0                 # freestream velocity [m/s]
  lRef: 1.044                     # reference length [m]
  Aref: 0.161                     # reference area [m²]
  rhoInf: 1.225                 # ambient density [kg/m³]
  CofR: [0.0, 0.0, 0.0]         # center of rotation for moments
  liftDir: [0.0, 1.0, 0.0]      # lift vector direction
  dragDir: [1.0, 0.0, 0.0]      # drag vector direction
  pitchAxis: [0.0, 0.0, 1.0]    # axis about which pitching moment is taken
  sideDir: [0.0, 0.0, 1.0]      # side force direction


###########################################
#              fvSchemes                  #
###########################################
fvSchemes:                     # discretisation schemes for each operator
  gradSchemes:
    default: Gauss linear       # gradient by Gauss’ theorem, linear interpolation
    grad(p): Gauss linear       # explicitly set same as default
    grad(U): cellLimited Gauss linear 1 # limits large gradient overshoots while maintaining accuracy
  divSchemes:
    div(phi,U): Gauss linearUpwind grad(U)
                                # convection term; linear upwind grad(U)
    div(phi,k): Gauss limitedLinear 1   # upwind scheme for k
    div(phi,epsilon): Gauss limitedLinear 1
    div((nuEff*dev2(T(grad(U))))): Gauss linear
                                # diffusion of momentum
  laplacianSchemes:
    default: Gauss linear corrected
                                # Laplacian with non-orthogonal correction
  interpolationSchemes:
    default: linear             # linear interpolation for face values
  snGradSchemes:
    default: corrected          # skewness correction for surface-normal gradient
  fluxRequired:
    default: no                 # do not store flux fields by default
    p: null                     # no pressure flux required


###########################################
#              fvSolution                 #
###########################################
fvSolution:
  solvers:
    p:                          # pressure solver settings
      solver: GAMG
      tolerance: 1e-7          # absolute residual tolerance - reduced from 1e-10
      relTol: 0.1             # relative tolerance → full solve each iteration - changed from 1e-20
      smoother: GaussSeidel
      nPreSweeps: 0
      nPostSweeps: 2
      cacheAgglomeration: true
      nCellsInCoarsestLevel: 10
      aggressiveCoeffs: 1
      agglomerator: faceAreaPair
      mergeLevels: 1
    U:                          # velocity solver settings
      solver: smoothSolver
      smoother: symGaussSeidel
      tolerance: 1e-6 # reduced from 1e-10
      relTol: 0.1 # reduced from 1e-20
    k:                          # k-equation solver
      solver: smoothSolver
      smoother: symGaussSeidel
      tolerance: 1e-6 # reduced from 1e-10
      relTol: 0.1 # reduced from 1e-20
    epsilon:                    # ε-equation solver
      solver: smoothSolver
      smoother: symGaussSeidel
      tolerance: 1e-6 # reduced from 1e-10
      relTol: 0.1 # reduced from 1e-20
    Phi:
      solver: smoothSolver
      smoother: symGaussSeidel
      tolerance: 1e-6
      relTol: 0.1

    divSchemes:
      div(phi,U): Gauss linearUpwind grad(U)
      div(phi,k): Gauss upwind
      div(phi,epsilon): Gauss upwind
      div((nuEff*dev2(T(grad(U))))): Gauss linear
      div(div(phi,U)): Gauss linear      # 🔧 Required for potentialFoam



  SIMPLE:                      # SIMPLE algorithm settings for steady flow
    nNonOrthogonalCorrectors: 3  # extra pressure corrections for non-orthogonality
    pRefPoint: (-5.542 0.839 0)           # pressure reference cell location
    pRefValue: 0                 # pressure reference value
    residualControl:             # stop when all residuals below these values
      p:       1e-5 #- reduced from 1e-9
      U:       1e-6 #- reduced from 1e-9
      k:       1e-6 #- reduced from 1e-9
      epsilon: 1e-6 #- reduced from 1e-9

  relaxationFactors:           # under-relaxation to stabilize convergence
    fields:
      p: 0.2
    equations:
      U:       0.3
      k:       0.3
      epsilon: 0.3

