###########################################
#           decomposeParDict              #
###########################################
decomposeParDict:
  method: scotch                      # method for domain decomposition (scotch = graph-based, automatic)
  
  simpleCoeffs:                       # settings if 'simple' method used instead of scotch
    n: (2 3 1)                        # processor layout in x, y, z
    delta: 0.001                      # relative tolerance in balancing cells

  hierarchicalCoeffs:                # alternative method: hierarchical splitting
    n: (1 3 2)                        # processor layout in x, y, z
    delta: 0.001                      # load imbalance tolerance
    order: xyz                        # direction priority in splitting

  distributed: no                    # single-root decomposition (no distributed file system)
  roots: ()                          # optional root directories for multi-region cases


###########################################
#     Advanced Geometry Settings          #
###########################################
format: ascii                         # geometry file format (ascii or binary)

advancedGeometrySettings:

  filePath:                           # container for geometry input files
    mergedGeometry:                   # main stitched surface (all parts merged into one STL)
      file: "constant/triSurface/Geometry/mergedGeometry/mergedGeometry.stl"  # path to merged STL
      name: Geometry                  # patch name assigned to this surface in snappyHexMesh

    refinementLevel: [2, 3]           # surface refinement- [minLevel, maxLevel]
                                      # ↑ higher levels → more mesh detail near surface

    boundingBoxGeneration_res: "constant/polyMesh/boundingBoxVertices.json" # bounding box helper (auto-generated)
    blockMesh: "system/blockMeshDict"  # base mesh template used for snappyHexMesh background mesh
    surfaceFeatureExtractDict: "system/surfaceFeatureExtractDict"           # config file for feature edge extraction

  scaling:                            # auto domain generation by scaling bounding box
    front: 5.0                        # scale domain extent in negative-x direction
    back: 10.0                        # scale in positive-x
    side: 2.5                         # scale both ±y directions
    top: 2.5                          # scale in positive-z direction

  surfaceFeatureExtractDict:
    extractAngle: 150                # keep features with sharp angles < 150°
    includedAngle: 30               # backup angle used by snappy if edge dict missing


###########################################
#          snappyHexMeshDict              #
###########################################
baseCellSize: 0.15                    # background mesh cell size

snappyHexMeshDict:
  debug: 0                            # verbosity level (0 = silent, 5 = max detail)
  mergeTolerance: 1e-6                # merge vertices closer than this distance

  geometry:                           # all geometry objects (STL, boxes, etc.)
    Geometry:
      type: triSurfaceMesh            # STL/OBJ reader type
      file: "Geometry/mergedGeometry/mergedGeometry.stl"
      name: Geometry
    refinementBox:                    # local refinement box
      type: searchableBox
    refinementBox2:                   # second refinement box
      type: searchableBox

  castellatedMeshControls:           # step 1: mesh cutting and refinement
    maxLocalCells: 120000000          # max cells per processor
    maxGlobalCells: 1200000000         # global cell limit
    minRefinementCells: 10           # min cells in a refinement region
    nCellsBetweenLevels: 3           # transition layers between refinement levels
    mergeTolerance: 1e-6             # merging threshold for points
    features: ()                     # auto-filled from surfaceFeatureExtract
    resolveFeatureAngle: 30          # extra refinement on edges sharper than this angle

    refinementSurfaces:              # surface-based refinement
      Geometry:
        level: [2, 3]                # refine this surface to levels 2–3

    refinementRegions:               # 3D refinement boxes
      refinementBox:
        name: refinementBox
        type: searchableBox
        scaling:
          front: 1.0
          back: 5.0
          side: 0.5
          top: 0.5
        mode: inside
        levels: [1, 2]               # apply refinement levels 1–2

      refinementBox2:
        name: refinementBox2
        type: searchableBox
        scaling:
          front: 0.2
          back: 0.75
          side: 0.2
          top: 0.2
        mode: inside
        levels: [2, 3]               # apply refinement levels 2–3

      refinementBoxwheelsFront:
        name: refinmentBoxWheelsFront
        geometry: wheelsFront
        type: searchableBox
        scaling:
          front: 0.01
          back: 0.01
          side: 0.01
          top: 0.01
        mode: inside
        levels: [3, 4]               # fine refinement for front wheels

      refinementBoxWheelsRear:
        name: refinmentBoxWheelsRear
        geometry: wheelsRear
        type: searchableBox
        scaling:
          front: 0.01
          back: 0.01
          side: 0.01
          top: 0.01
        mode: inside
        levels: [3, 4]               # fine refinement for rear wheels

    locationInMesh: (0 0 0)         # seed point inside the fluid domain
    allowFreeStandingZoneFaces: false  # exotic mesh option; leave false

  snapControls:                      # step 2: surface snapping
    nSmoothPatch: 3                  # number of smoothing iterations
    tolerance: 2.0                   # snap aggressiveness
    nSolveIter: 30                   # Laplace solver iterations
    nRelaxIter: 5                    # relax geometry between iterations
    explicitFeatureSnap: true        # enable explicit snapping to edges
    multiRegionSnap: false           # only for multi-region cases

  addLayersControls:                 # step 3: add boundary layers
    relativeSizes: true              # layer thickness relative to cell height
    layers:
      Geometry: {nSurfaceLayers: 15} # number of layers on main surface
      bottom: {nSurfaceLayers: 0}    # no layers on 'bottom' patch
    expansionRatio: 1.2              # how quickly layers grow
    finalLayerThickness: 0.3         # last layer thickness as % of cell height
    minThickness: 1e-6               # minimum layer thickness
    nGrow: 0                         # prevent layer growth on neighbors
    featureAngle: 180                # stop growing if surface bends too much
    nRelaxIter: 3                    # post-growth smoothing
    nSmoothSurfaceNormals: 1         # surface normal smoothing passes
    nSmoothNormals: 3                # normal vector smoothing
    nSmoothThickness: 10             # layer thickness smoothing
    maxFaceThicknessRatio: 0.5       # max layer thickness / face length
    maxThicknessToMedialRatio: 0.3   # ratio to medial axis
    minMedialAxisAngle: 60           # min angle between face normal and medial axis
    nBufferCellsNoExtrude: 0         # cells without extrusion buffer
    nLayerIter: 50                   # number of extrusion iterations
    nRelaxedIter: 20                 # post-extrusion smoothing passes

  meshQualityControls:               # mesh validation criteria
    maxNonOrtho: 65                  # non-orthogonality angle
    maxBoundarySkewness: 20          # skewness on boundaries
    maxInternalSkewness: 4           # skewness inside the mesh
    maxConcave: 80                   # max concavity allowed
    minVol: 1e-13                    # minimum cell volume
    minTetQuality: 1e-9              # tetrahedron quality threshold
    minArea: -1                      # disable area check
    minTwist: 0.02                   # minimum twist
    minDeterminant: 0.001            # minimum Jacobian determinant
    minFaceWeight: 0.02              # face quality control
    minVolRatio: 0.01                # min cell volume ratio
    minTriangleTwist: -1             # disable triangle twist check
    nSmoothScale: 4                  # smoothing strength
    errorReduction: 0.75             # try this hard to fix bad cells

###########################################
#        Advanced Fluid Properties        #
###########################################
turbulence:
  RAS:
    turbulence: on                  # enable RANS turbulence model
    printCoeffs: on                 # print model coefficients for debug

###########################################
#      Advanced initial conditions        #
###########################################

fields:                              # list of initial fields
  - U                                # velocity
  - p                                # pressure
  - k                                # turbulence kinetic energy
  - epsilon                          # turbulence dissipation rate
  - nut                              # turbulent viscosity

U:
  dimensions: [0, 1, -1, 0, 0, 0, 0] # SI units: m/s

p:
  dimensions: [0, 2, -2, 0, 0, 0, 0] # SI units: Pa

k:
  dimensions: [0, 2, -2, 0, 0, 0, 0] # same units as pressure

epsilon:
  dimensions: [0, 2, -3, 0, 0, 0, 0] # units for dissipation rate

nut:
  dimensions: [0, 2, -1, 0, 0, 0, 0] # kinematic viscosity (m²/s)


###########################################
#           Advanced Control              #
###########################################
control:
  application: snappyHexMesh          # executable to be run (overrides command line)
  startFrom: startTime                # when to start (startTime, latestTime, etc.)
  stopAt: endTime                     # when to stop
  writeFormat: ascii                  # output format  (ascii vs binary)
  writePrecision: 6                  # number of decimals in output
  writeCompression: uncompressed     # no compression (easier to debug)
  timeFormat: general                # general time format (vs fixed, scientific)
  timePrecision: 6                   # decimals for time values
  runTimeModifiable: true            # allow dictionary edits mid-run
  adjustTimeStep: true               # adaptive time stepping

