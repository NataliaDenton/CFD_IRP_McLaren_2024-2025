###########################################
#     Parallel computing settings         #
###########################################
cores: 16               # number of CPU cores to use for parallel execution


###########################################
#            Case settings                #
###########################################
filePath:
  caseDir: "../src/Openfoam/AeroSUVDC"     # directory where the OpenFOAM case resides
  logDir: "log"                            # base directory for all log files
  logMesh: "log/blockMesh.log"             # log for background mesh generation
  logSnappy: "log/snappyHexMesh.log"       # log for snappyHexMesh execution
  logPotential: "log/potentialFoam.log"    # log for potentialFoam preprocessing
  logSolver: "log/simpleFoam.log"          # log for the steady-state solver (simpleFoam)


###########################################
#          Geometry Settings              #
###########################################
  geometries:                             # list of STL geometry parts to import
    body:                                 # short key to reference the vehicle body
      file: "constant/triSurface/Geometry/01_body.stl"
    sideMirrors:
      file: "constant/triSurface/Geometry/02_side-mirrors.stl"
    rearEnd:
      file: "constant/triSurface/Geometry/03_rear-end_estate.stl"
    underbody:
      file: "constant/triSurface/Geometry/07_underbody-detailed.stl"
    grillTop:
      file: "constant/triSurface/Geometry/09_grille-top.stl"
    grilleBottom:
      file: "constant/triSurface/Geometry/10_grille-bottom.stl"
    suspensionFront:
      file: "constant/triSurface/Geometry/14_suspension_front.stl"
    suspensionRear:
      file: "constant/triSurface/Geometry/15_suspension_rear.stl"
    exhaust:
      file: "constant/triSurface/Geometry/16_exhaust.stl"
    wheelsFront:
      file: "constant/triSurface/Geometry/17_wheels-front.stl"
    wheelsRear:
      file: "constant/triSurface/Geometry/18_wheels-rear.stl"
    coolingBlocker:
      file: "constant/triSurface/Geometry/20_cooling-air-closing.stl"
    engineCompartment:
      file: "constant/triSurface/Geometry/21_engine-compartment-closing.stl"


###########################################
#                Meshing                  #
###########################################
mesh:
  useSnappy: true      # enable snappyHexMesh workflow
  useCfMesh: false     # disable cfMesh alternative path

snappyHexMeshDict:    # high‑level toggles; detailed configuration resides in advancedConfig
  castellatedMesh: true    # perform castellated‑mesh (cut background cells)
  snap: true               # snap cell faces onto the STL geometry
  addLayers: true          # add prism layers near walls for y⁺ control
  refinementRegions: true  # activate region‑based and box‑based refinements


###########################################
#            Fluid Properties             #
###########################################
fluid:                    # physical properties of the working fluid
  name: air
  rho: 1.184              # fluid density [kg/m³] at 15 °C, sea‑level
  nu: 1.56e-5             # kinematic viscosity [m²/s]


###########################################
#            Turbulence Model             #
###########################################
turbulence:
  simulationType: RAS     # Reynolds‑Averaged Simulation framework
  model: kEpsilon         # choose k‑ε model for turbulence closure


###########################################
#           Initial conditions            #
###########################################
fields:                  # list of primary fields to initialize
  - U
  - p
  - k
  - epsilon
  - nut

U:                       # velocity field
  internalField: [50, 0, 0]  # uniform freestream velocity [m/s]
  boundaries:
    inlet:
      type: fixedValue       # enforce constant velocity at inlet
      value: [50, 0, 0]
    outlet:
      type: zeroGradient     # allow gradient-free outflow
    bottom:
      type: fixedValue       # moving-ground approach (bottom at freestream speed)
      value: [50, 0, 0]
    top:
      type: symmetryPlane    # symmetry boundary for free‑stream plane
    front:
      type: symmetryPlane
    back:
      type: symmetryPlane
    Geometry:
      type: fixedValue       # no-slip on car surfaces
      value: [0, 0, 0]

p:                       # pressure field
  internalField: 1.01325e5   # atmospheric pressure [Pa]
  boundaries:
    inlet:
      type: zeroGradient      # pressure gradient-free inflow
    outlet:
      type: fixedValue        # fixed ambient pressure at outlet
      value: 1.01325e5
    bottom:
      type: zeroGradient
    top:
      type: symmetryPlane
    front:
      type: symmetryPlane
    back:
      type: symmetryPlane
    Geometry:
      type: zeroGradient      # pressure adjusts naturally on car surfaces

k:                       # turbulence kinetic energy
  internalField: 2.69        # estimated from turbulence intensity
  boundaries:
    inlet:
      type: fixedValue
      value: 2.69
    outlet:
      type: zeroGradient
    bottom:
      type: kqRWallFunction   # wall function for k on ground patch
      value: uniform 2.69
    top:
      type: symmetryPlane
    front:
      type: symmetryPlane
    back:
      type: symmetryPlane
    Geometry:
      type: kqRWallFunction   # wall function for k on car surfaces
      value: uniform 2.69

epsilon:                 # turbulence dissipation rate
  internalField: 7.45      # computed from k and length scale
  boundaries:
    inlet:
      type: fixedValue
      value: 7.45
    outlet:
      type: zeroGradient
    bottom:
      type: epsilonWallFunction  # wall function for ε on ground
      value: uniform 7.45
    top:
      type: symmetryPlane
    front:
      type: symmetryPlane
    back:
      type: symmetryPlane
    Geometry:
      type: epsilonWallFunction  # wall function for ε on car surfaces
      value: uniform 7.45

nut:                     # turbulent (eddy) viscosity
  internalField: 0.0908     # derived from k and ε
  boundaries:
    inlet:
      type: calculated       # computed from turbulence model
      value: 0.0908
    outlet:
      type: calculated       # computed on exit plane
      value: 0.0908
    bottom:
      type: nutkWallFunction  # wall function for nut on ground
      value: uniform 0
    top:
      type: symmetryPlane
    front:
      type: symmetryPlane
    back:
      type: symmetryPlane
    Geometry:
      type: nutkWallFunction  # wall function for nut on car surfaces
      value: uniform 0


###########################################
#               Control                   #
###########################################
control:
  # ---------- global time settings ----------
  startTime:    0         # simulation start time [s]
  endTime:      10        # simulation end time [s]
  avarageTimeStart: 8     # begin time-averaging statistics at 8 s
  deltaT:       1e-2      # pseudo‑time step for steady solver iterations
  writeControl: timeStep  # write results every N iterations
  writeInterval: 50       # write every 50 iterations
  purgeWrite:   100       # keep only the last 100 write directories

  # ---------- numerical defaults ----------
fvSchemes:
  default: steadyState    # use 'steadyState' scheme for time derivative (simpleFoam style)

